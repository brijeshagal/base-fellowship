version: '3.7'

services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=yourStrongPassword
      - N8N_CUSTOM_EXTENSIONS=/data/nodes:/data/credentials
      - N8N_HOST=0.0.0.0
    volumes:
      - ./dist/nodes:/data/nodes
      - ./dist/credentials:/data/credentials
      - ~/.n8n:/home/node/.n8n